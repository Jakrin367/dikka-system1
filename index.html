<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้า 1: รับข้อมูลฎีกาใหม่</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>ระบบคุมฎีกาและค้นหาผู้ตรวจอัตโนมัติ</h1>

  <div class="nav-menu">
    <a href="index.html" class="nav-btn active">หน้า 1: รับข้อมูล (กรอกฎีกา)</a>
    <a href="page2.html" class="nav-btn">หน้า 2: คุมฎีกา & ค้นหา</a>
    <a href="page3.html" class="nav-btn">หน้า 3: กำหนดผู้ตรวจ</a>
  </div>

  <div class="card">
    <h2>กรอกข้อมูลฎีกาใหม่</h2>
    <form id="dikkaForm" onsubmit="saveDikka(event)">
      <div class="form-group">
        <label for="dikkaNo">เลขฎีกา</label>
        <input type="text" id="dikkaNo" required placeholder="เช่น 05626">
      </div>
      <div class="form-group">
        <label for="dikkaDate">วันที่รับ</label>
        <input type="date" id="dikkaDate" required>
      </div>
      <div class="form-group">
        <!-- Dropdown สำนัก/กอง (เพิ่มใหม่) -->
<label for="mainDeptSelect">สำนัก / กอง</label>
<select id="mainDeptSelect" onchange="onMainDeptChange()">
  <option value="">-- เลือกสำนัก/กอง --</option>
</select>

<!-- Dropdown แผนงาน/งาน/รายการ (เดิม) -->
<label for="deptSelect">แผนงาน / งาน / สังกัดกอง</label>
<select id="deptSelect" onchange="autoMatchInspector()">
  <option value="">-- เลือกแผนงาน / งาน / รายการ --</option>
</select>

      </div>
      <div class="form-group">
        <label for="inspectorInput">ผู้ตรวจ (ระบบดึงให้อัตโนมัติ)</label>
        <input type="text" id="inspectorInput" class="auto-filled" readonly placeholder="จะแสดงอัตโนมัติเมื่อเลือกแผนงาน">
      </div>
      <div class="form-group">
        <label for="itemDetail">รายการ</label>
        <input type="text" id="itemDetail" placeholder="ระบุรายการ..." required>
      </div>

      <!-- ตัวเลือกผู้รับเงิน -->
      <div class="form-group">
        <label>ผู้รับเงิน</label>
        <div style="display: flex; gap: 20px; margin-bottom: 8px;">
          <label style="font-weight: normal; cursor: pointer;">
            <input type="radio" name="payeeType" value="ktb" onchange="togglePayeeInput()"> KTB corporate
          </label>
          <label style="font-weight: normal; cursor: pointer;">
            <input type="radio" name="payeeType" value="custom" checked onchange="togglePayeeInput()"> กรอกเอง
          </label>
        </div>
        <input type="text" id="payee" placeholder="ระบุชื่อผู้รับเงิน เช่น บริษัท C" required>
      </div>

      <div class="form-group">
        <label for="amount">จำนวนเงิน (บาท)</label>
        <input type="number" id="amount" step="0.01" required>
      </div>
      <button type="submit" class="btn btn-primary">บันทึกข้อมูล</button>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
